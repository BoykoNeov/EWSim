# slice34_gimbal — THE GIMBAL: THE HEAD POINTS WHERE THE GLASS SAYS THE TARGET IS
# (HANDOFF §11 Tier-A, slice 34 gate 3). The TWELFTH slice of the bank-to-turn / 3-D arc (23 = the
# 6-DOF substrate + skid-to-turn, 24 = bank-to-turn + roll-lag, 25 = a seeker in the 6-DOF loop,
# 26 = the radome parasitic loop, 27 = the compensation autopilot, 28 = the slope CURVE, 29 = the
# SCHEDULED compensator, 30 = the ENVELOPE and the one-sided constraint, 31 = an imperfect gyro,
# 32 = the seeker's field of view, 33 = the ring as an FOV budget item), and the successor slices
# 32 AND 33 both nominated.
#
# ⭐⭐ THIS FILE HAS A TWIN, AND THE TWIN IS HALF THE LESSON: `slice34_strapdown.yaml` is the SAME
# glass, the SAME believed slope, the SAME seed and the SAME engagement with the head REMOVED. It
# RINGS (rms r 0.93194) where this one is QUIET (0.01181) — 78.9×. Two scenarios because the head is
# not a rung and cannot be toggled: `gimbal_tau_s` is AUTHORED (see the knob block for the
# MEASUREMENT that keeps it out of the slider list) and there is no in-domain slider value that
# removes a head. Slice 22's precedent — two wires for one slice, when the halves need incompatible
# configurations — and `slice34_verify.gd` flies BOTH through one `load_scenario`.
#
# Slices 26–33 built the parasitic loop on ONE geometric fact: the radome bends the ray by an amount
# set by the LOOK ANGLE, and the look angle is the LOS measured off the missile's OWN NOSE. That is a
# quantity the missile can only move by ROTATING — which is exactly why the loop closes through the
# body and why slice 26 is a BODY-RATE instability. A GIMBALLED SEEKER BREAKS THAT IDENTITY. Its head
# has its own pointing angles, the ray passes through the part of the dome the head is AIMED at, and
# — this is the whole slice — THE HEAD IS AIMED BY THE VERY MEASUREMENT THE DOME JUST BENT. The index
# of the glass becomes a FIXED POINT of the glass, so part of the bend's own variation is absorbed by
# the head's pointing instead of being handed to guidance: slice 26's loop is partly RE-CLOSED THROUGH
# THE HEAD, where its sign is NEGATIVE.
#
# > THE LESSON, IN ONE SENTENCE. A strapdown seeker's radome index is handed to it by the airframe; a
# > gimballed seeker's is handed to it by its own last measurement — and an index that looks at
# > itself is an index that fights back.
#
# ⇒ THE ONSET WALKS TWO RUNGS OF THE LADDER, and it is quoted BRACKET TO BRACKET and never as one
# number (slice 30's "sufficient, never tight" discipline): (−0.27, −0.24] strapdown against
# (−0.18, −0.16] gimballed. ⭐ AND `head_max` STEPS AT THE SAME PLACE — flat at 18.117° through every
# quiet arm and 20.619° at the first ringing one — a SECOND tell from a DIFFERENT quantity, which is
# what makes the bracket a MEASUREMENT and not a threshold read off the metric that defined it.
#
# ⚠ AND IT IS NOT FREE, IN THE ONE CURRENCY A GIMBAL HAS. The margin is bought by the head's pointing
# DECOUPLING from the true LOS, and the size of that decoupling is precisely the tracking error the
# head's own detector must cover. SLICE 33's SINGLE NUMBER SPLITS IN TWO: a STOP (the head's TRAVEL
# about the body, which reproduces slice 33's excursion — a RESTATEMENT, not a new claim) and a
# DETECTOR WINDOW (about the head axis — NEW, and where the margin is paid for). Gate 2 measured that
# the two are ONE BUDGET and not two independent limits: a clamped head cannot reach the LOS, so its
# deficit is spent out of the detector's allowance.
#
# ⭐⭐ SLICE 32's PREDICATE RETURNS IN THE CURRENCY A GIMBAL ACTUALLY HAS: `held ⟺ tracking error <
# detector window`. Slice 32 measured `held ⟺ lead < fov` about the BODY; here the window is the
# DETECTOR's, about the HEAD, and what it must cover is the TRACKING ERROR. ⚠ The two sides come from
# DIFFERENT RUNS — the error off a FREE arm, the verdict off a WINDOWED one — which is what makes it a
# measurement rather than a restatement (bracketed to 0.005° on the quiet arm; CONSERVATIVE by ~1 % on
# the ringing one, because a windowed arm is a DIFFERENT TRAJECTORY and a ring diverges faster once it
# clips. Both directions stated rather than tuned away).
#
# ⚠⚠ THE TWO-RUN DISCIPLINE IS INHERITED FROM SLICE 33 AND IT IS MANDATORY HERE FOR A SECOND,
# INDEPENDENT REASON (gate 0 §0.7, MEASURED): the head HOLDS when it loses its error signal, so a
# broken detector window FREEZES the index — and a frozen index produces a CONSTANT bend, which gate 0
# measured QUIET AT EVERY R̂. So on a windowed arm `rms r` FALLS while the miss OPENS (4.2× down
# against 220× out), and `head_off_deg` becomes the ~89° post-lock-loss runaway rather than the
# tracking error.
# ⚠⚠ AND THE LIST IS THREE QUANTITIES, NOT TWO — THE THIRD IS THE DANGEROUS ONE. `rms r` FALLS and the
# tracking error RUNS AWAY, both visibly wrong. `head_angle_deg` FREEZES at the value it held when the
# track broke, so a windowed arm reads 18.117° — THE QUIET ARMS' NUMBER — where its ring is 20.619°: a
# plausible number, in range, on the low side. A verifier reading the excursion off a windowed run
# gets the quiet arm's answer and would report that the ring costs nothing.
#
# ⚠ NO NEW RUNG, NO NEW CAP, NO NEW INSTABILITY, NO NEW DRAW. The head is a DETERMINISTIC SERVO on an
# existing measurement (class 4a, 2 randn/tick, the TENTH consecutive RNG-live slice — the seed is
# load-bearing and conventions 3/11 apply). What is new is the INDEX, four telemetry numbers that
# measure it, and the design rule.
#
# ⚠ THE HEAD REACHES THE TRAJECTORY THROUGH EXACTLY TWO CHANNELS — the radome's INDEX and the detector
# WINDOW — and gate 2 shipped that as three bit-identity controls, all EXACTLY 0: no glass + no window
# ⇒ inert at every τ; a WIDE `gimbal_fov_deg` ⇒ bit-identical to the key absent (atmosphere.jl's
# KNOB-vs-RUNG discriminator applied to the one slider ⇒ KNOB, no rung, button DROPPED); a
# non-binding STOP ⇒ inert (which is what licenses the unconditional `head_clamp` at the handover).
#
# ⚠⚠ THE LOADER REFUSES `seeker_fov_deg` BESIDE A HEAD, AND THAT IS PHYSICS, NOT HYGIENE: a gimballed
# seeker has NO body-fixed window. Its body-fixed limit is the mechanical STOP and its window is the
# DETECTOR's, about the head axis; slice 32's key here would be an unmodelled THIRD window (the
# slice-21 "refused, not branch-ordered" precedent). ⇒ this wire raises `radome_view` and NOT
# `seeker_fov_view`, so it ships its OWN handshake marker `gimbal_view` and the client branches on it
# FIRST — without which the HUD falls into slice 26/27/28's radome cascade and prints a confident
# ring/quiet verdict about the GLASS on a wire whose whole subject is the HEAD. ⚠ Every number that
# cascade reads is LIVE and PLAUSIBLE here (this wire HAS glass), so it is the stale-readout class's
# worst form: nothing is stale, the subject is simply wrong, and no test would fail.
#
# NAMED APPROXIMATIONS (§1): a HANDED-OVER head (it initialises to the CLAMPED truth look angles on
# tick 1 — gate 0 measured a CAGED head's window requirement degenerating to the strapdown one,
# 18.117°, so the handover is a stated condition and not a nicety; making it addressable is the named
# successor); NO RATE LIMIT on the head (`gimbal_rate_max` was built at gate 0 and never exercised —
# the slice-19 dead-knob discipline applied before the knob exists); NO MEMORY TRACK — once the target
# leaves the detector window the head HOLDS, so the break is TERMINAL (slice 32's α-β choice, one
# layer out); a CIRCULAR stop AND a CIRCULAR window (a real two-axis gimbal has independent
# rectangular stops — a named deferral, and gate 1 wrote down that its species argument is the ONLY
# evidence, since no flying arm has ever bound the stop); NO HEAD GYRO (a rate-stabilized head
# measures inertial LOS rate directly — the classical reason gimbals exist, and a DIFFERENT mechanism
# from anything here); plus everything 26–33 named, unchanged — ONE odd scalar slope curve PER AXIS,
# a PERFECT gyro (slice 31's terms absent), ONE isotropic σ and a TRUTH Vc, diagonal inertia,
# symmetric cruciform, lift drag-free, constant ρ (a FLIGHT CONDITION — say "low dynamic pressure",
# never "high altitude").
# ⚠ THE 30° MODEL-VALIDITY CAVEAT 28/29/30/31 EACH DECLARED IS STILL A CAVEAT AND NOT A STOP: the
# mechanical stop here is 30° and the head never reaches it (18.1° of travel on every quiet arm,
# 23.6° at the loudest), so the small-angle bend keeps its headroom — see the knob block, where the R̂
# ceiling is where that budget is actually spent.
#
# UNITS (§1 trifecta): pos/vel SI; angles rad INSIDE the core; `gimbal_stop_deg` / `gimbal_fov_deg` /
# `gimbal_fov_margin_deg` / `head_angle_deg` / `head_off_deg` in DEGREES at the wire boundary (the
# stop and the window are TOTAL half-angles about their own axis, and the margin is SIGNED);
# `gimbal_tau_s` in SECONDS; radome slopes DIMENSIONLESS (rad of bend per rad of look); σ_seek in
# RADIANS; `cross_speed_mps` in m/s and SIGNED; I in kg·m²; ρ in kg/m³; launch ELEVATION in DEGREES →
# radians at the loader. dt = 1e-3 / emit_every = 16.
name: slice34_gimbal
seed: 32
dt_physics: 1.0e-3
emit_every: 16

fidelity:
  # FIVE keys, NONE toggled — the lesson is the SLIDERS (the 16/20/26/27/28/29/30/31/32/33 shape, and
  # the TENTH consecutive slice with no fidelity button at all). `airframe` HELD at :six_dof (the
  # head is gated on the LIVE rung, never on `haskey(:head_az)` — the slice-21 `_atm_on` latent-bug
  # class, whose SEVENTH occurrence this would have been; the head and the attitude it is measured
  # against freeze and resume TOGETHER because both are written under that same rung), `seeker_axes`
  # HELD at :az_el (a two-angle seeker is what HAS a look angle at all — and the loader REFUSES
  # `gimbal_tau_s` without `two_angle: true` for exactly that reason), `seeker` HELD at :filtered,
  # `autopilot` :alpha and `guidance` :pn as in 23–33. `steering` is OMITTED (the loader default IS
  # :skid_to_turn — slice 24 measured BTT binding the aero ceiling 93.2 % of its approach, a THIRD
  # mechanism on a wire convention 9 already stretches to two).
  airframe: six_dof
  autopilot: alpha
  guidance: pn
  seeker: filtered
  seeker_axes: az_el

entities:
  # The interceptor — slices 23–33's plant and launch condition, UNCHANGED to the digit, because the
  # strapdown TWIN has to reproduce slices 30/33's ladder exactly for the pair to mean anything.
  # n_pn = 8 is slice 27's, AUTHORED and NEVER A KNOB (26–33 all disqualified it: it moves the
  # guidance loop the lesson is not about, and here it moves the parasitic boundary N·|R − R̂|/ρ too).
  #
  # ⚠ elevation_deg = 12.0 IS LOAD-CONSUMED AND IS NOT A KNOB (the slice-19 DEAD-KNOB class:
  # position/attitude are built once at load and `reset` re-reads the YAML), and slice 32's gate-0 P5
  # found it is also what sets a HANDED-OVER head's tick-1 pointing — the handover this file names as
  # a §1 condition.
  #
  # THE GLASS (26–29's, unchanged in form):
  #   radome_slope    R₀ = −0.03 — the boresight slope.
  #   radome_ripple   A  = −0.15 — the slope CURVE's depth, so `radome_slope_worst` = R₀ + 2A = −0.33.
  #   radome_ripple_k k  = 12.0  — AUTHORED and DISQUALIFIED BY NON-MONOTONICITY at slice 28.
  #   radome_slope_est R̂ = −0.18 — ⭐⭐ THE SHOWCASE RESIDUAL, AND IT IS CHOSEN AS THE PLACE THE TWO
  #     WIRES DISAGREE MOST CLEANLY. It is INSIDE the strapdown ring bracket (−0.27, −0.24] and
  #     OUTSIDE the gimballed one (−0.18, −0.16], so the SAME believed slope on the SAME glass is a
  #     RINGING design strapdown and a QUIET one gimballed. ⚠ This is NOT the 25–33 "open on the
  #     disease" default and the reason is MEASURED, not stylistic: the disease here is a STABILITY
  #     verdict, and the two-run discipline above forbids reading one on an arm whose window binds —
  #     so the wire opens on the arm whose `rms r` is legible, and the DISEASE is the twin.
  #
  # THE HEAD:
  #   gimbal_tau_s  τ = 0.05 — AUTHORED. See the knob block: gate 2 measured τ CONFOUNDED, not dead.
  #   gimbal_stop_deg = 30.0 — AUTHORED, and it is a RESTATEMENT of slice 33's excursion rather than
  #     a new limit: the head's travel requirement IS the engagement's lead (18.117° on every quiet
  #     arm here, 23.601° at the loudest R̂ the slider reaches), so 30° covers the whole R̂ domain with
  #     ~6° of headroom and NEVER BINDS on this wire. ⚠ Gate 2 measured what happens when it does —
  #     the deficit is charged to the DETECTOR budget, `off_head ≈ (travel − stop) + free error` —
  #     and that is a SECOND mechanism, so convention 9 keeps it in `test_missile.jl`.
  #   gimbal_fov_deg = 4.0 — the DETECTOR window, and the one live slider. It CLEARS the default
  #     design's free tracking error (1.956°) by better than 2× while sitting BELOW the ringing arms'
  #     (5.237° at R̂ = −0.16), which is what makes the R̂ slider's own cliff visible without touching
  #     this one. ⚠ It is NOT the free read — the domain CEILING is (see the knobs).
  - id: m1
    kind: missile
    pos: [0.0, 0.0, 3000.0]
    missile:
      mass_kg: 140.0
      speed: 700.0
      elevation_deg: 12.0
      cd_area_m2: 0.0
      rho: 1.0
      seeker: {sigma_seek: 5.0e-5, alpha: 0.30, beta: 0.05, two_angle: true,
               radome_slope: -0.03, radome_ripple: -0.15, radome_ripple_k: 12.0,
               radome_slope_est: -0.18,
               gimbal_tau_s: 0.05, gimbal_stop_deg: 30.0, gimbal_fov_deg: 4.0}
      guidance: {n_pn: 8.0, a_max: 3000.0, delta_max: 0.5, k_alpha: 1.0, k_q: 0.3}
      airframe:
        ref_len_m: 0.2
        inertia_kgm2: 20.0
        cma: -1.0
        cmd: 3.0
        cmq: -150.0
        cla: 20.0
        alpha_max: 0.3
        cy_beta: 20.0
        inertia_roll_kgm2: 2.0
        inertia_yaw_kgm2: 20.0
        c_roll: 50.0
  # ⭐ THE CROSSING TARGET, AND THE CROSSING IS WHAT MAKES THE GLASS MATTER AT ALL. Same start point
  # as 23–33 (cross-range +Y = 2000 m off the x–z plane), at slice 28's vy = 200 m/s — the geometry
  # that holds a SUSTAINED ~15° lead, so the seeker parks on the steep part of the slope curve and the
  # loop is closed by its LOCAL DERIVATIVE there. ⚠ A STATIC target would make the whole family dead
  # at once (slice 28 measured the lead at 0.04°→0.54° there). It is ALSO what gives the head
  # something to track: a head whose target sits on the boresight is a head with no tracking error and
  # therefore no detector budget to spend. AERODYNAMICALLY FREE (no target airframe).
  # ⚠ `cross_speed_mps` IS AUTHORED AND IS NOT A KNOB HERE, unlike slices 30 and 32 — it moves the
  # LEAD, i.e. slice 32's whole axis, which would be the THIRD thing convention 9 forbids on this
  # wire. The authored `vel` and the pin AGREE at the default (slice 30's knob-vs-rung discriminator).
  - id: tgt1
    kind: target
    pos: [6000.0, 2000.0, 4200.0]
    vel: [0.0, 200.0, 0.0]
    target: {rcs_m2: 1.0, cross_speed_mps: 200.0}

knobs:
  # ⭐⭐ TWO KNOBS, AND THEY ARE THE TWO HALVES OF ONE COMPARISON — `window` vs `tracking error(R̂)` —
  # which is slice 33's pair (`fov` vs `excursion(R̂)`) re-expressed in the currency a gimbal has, and
  # slice 32's (`fov` vs `lead(vy)`) one layer before that. Convention 9 is satisfied BY MEASUREMENT
  # (the slice-27 DIAGONAL precedent): move both together and `held` does not change, so the pair is
  # ONE axis and not two lessons. ⚠ THE DIAGONAL IS STATED AS TRACKING, NEVER AS
  # `window = ⌈error(R̂)⌉` — gate 2 measured that `ceil` rule SUFFICIENT BUT NOT TIGHT (on a 0.1° grid
  # the ringing row holds already at 5.30, 0.7° below the ceiling gate 0's 1° grid reported), and the
  # PHYSICAL claim is the inequality.
  #
  # ⚠ AND THE ASYMMETRY IS THE PAYLOAD, AS IT WAS IN 32 AND 33, BUT IT HAS MOVED AGAIN. Slice 32:
  # widen the seeker (free) or decline the engagement (not free). Slice 33: widen (sized to a number
  # you measured) or aim R̂ at the rule (depth-independent). HERE: widening the DETECTOR buys back
  # THIS design on THIS glass, while aiming R̂ DOWN removes the tracking error that was spending the
  # budget in the first place — and the second cure is the one that also buys the STABILITY, because
  # on this wire the two limits are reached by the SAME slider. That coincidence is slice 33's "the
  # FOV bound is NOT tighter than the stability bound" arriving in the head's own currency.
  #
  # KNOB 1 (`gimbal_fov_deg`, the HARDWARE side) — the slice's ONE genuinely new axis, and BOTH
  # ENDPOINTS ARE MEASURED WITH THEIR REASONS (slice 26's post-commit discipline: endpoints MEASURED,
  # never inferred from the interior).
  #   FLOOR 1.0: the design's free tracking error is 1.956°, so the floor is comfortably INSIDE the
  #     cliff and a student can watch the track break (miss 1029 m, 65 % of the approach with no
  #     measurement at all). ⚠ It is not lower because below ~1° the arm stops producing a legible
  #     band column at all, which is slice 33's own gate-2 catch (`rms r` from ZERO samples).
  #   CEILING 8.0: THE FREE READ, and this is a functional domain edge rather than decoration. The
  #     two-run discipline says the tracking error and the head travel must be measured on an arm the
  #     window never bites; a live wire ALWAYS carries the key, so the free read IS this endpoint —
  #     and its adequacy is MEASURED and not assumed: at 8.0 the trajectory is BIT-IDENTICAL
  #     (max|Δpos| == 0) to the key being absent, across the R̂ domain. ⚠ IT IS DELIBERATELY ABOVE THE
  #     SHIPPED DEFAULT AND ABOVE THE LOUDEST ARM's 5.916°, so the free column reads THE RING and
  #     never the ~89° post-lock-loss runaway. ⚠ AND THE DEFAULT 4.0 IS **NOT** BIT-IDENTICAL TO FREE
  #     (max|Δpos| 9.2e−11 m): the window is reached in the last metres as the LOS unit vector swings
  #     through a large angle at r → 0, which is slice 33's own endgame finding. It is a FREE READ ON
  #     THE APPROACH (0.00 % out at r > 200 m), which is the only claim this file makes for it.
  #
  # KNOB 2 (`radome_slope_est`, the DESIGN side) — 27/28/33's R̂ slider, re-domained for this wire, and
  # here it is doing DOUBLE DUTY that is measured rather than assumed: it moves the STABILITY verdict
  # (the bracket) AND the tracking error the detector must cover (1.956° quiet → 5.237° ringing, 2.7×
  # — slice 33's payload in the new currency), which is exactly why the pair above is one axis.
  #   FLOOR −0.36: BELOW slice 30's aim point (`radome_slope_worst` = R₀ + 2A = −0.33) so the rule is
  #     REACHABLE and OVERSHOOTABLE — the one-sided constraint (only a NEGATIVE residual rings; a
  #     positive one de-tunes). ⚠ The gimballed onset is TWO RUNGS SHORTER than the strapdown one, so
  #     a student who walks this slider on both wires sees the SAME slider produce two different
  #     brackets, which is the slice stated as an experiment rather than as a number.
  #     ⚠⚠ MEASURED AT GATE 3's POST-REVIEW, AND THE FIRST DRAFT OF THIS LINE WAS WRONG ABOUT WHAT
  #     THE OVERSHOOT SHOWS. It said the requirement "STOPS FALLING"; it does not. Past the aim
  #     point the RING TURNS BACK UP (rms r 0.05917 → 0.06946 gimballed, 0.05879 → 0.06911
  #     strapdown) and the MISS grows monotonically (0.161 → 0.433 m, and on to 5.669 m at R̂ = −0.50
  #     measured beyond the domain) — a DE-TUNE THAT REVERSES, which is a sharper thing to see than a
  #     plateau. Slice 30's one-sided constraint is intact: it never RINGS anywhere down here (0.069
  #     against the 0.30 line) and neither limit binds (head travel 18.117° of 30°, tracking error
  #     1.508° of 4°, so the 4° window is INERT at the floor too). ⚠ And the DETECTOR bill is NOT
  #     monotone in R̂ — 1.599 → 1.508 → 1.383° at −0.33/−0.36/−0.40, a MINIMUM past the aim point —
  #     so the floor is chosen where the REVERSAL is visible and both limits still have margin, not
  #     where a bill is largest. (The endpoint was flown NOWHERE before this: slice 26's own
  #     post-commit rule, applied to the window knob and missed on this one.)
  #   CEILING −0.03: the glass's own boresight slope, i.e. slice 28's BORESIGHT characterization (the
  #     natural and dangerous choice), which is the LOUDEST arm the domain reaches — and THE CEILING
  #     IS THE 30° MODEL-VALIDITY BUDGET 28/29/30/31 EACH DECLARED, here as a measured edge: the head
  #     travel is already 23.601° there against a 30° stop.
  #
  # ⚠ EVERY OTHER CANDIDATE IS DISQUALIFIED, AND THE VERIFIER ASSERTS THEIR ABSENCE. `gimbal_tau_s`
  # heads the list and its exclusion is the one that is MEASURED rather than argued: gate 2 found the
  # amplitude sags monotonically with τ on EVERY arm, and AT THE LINE that same sag crosses the
  # verdict — the bracket walks from (−0.18, −0.17] at τ ≤ 0.02 to (−0.16, −0.12] at τ = 0.20. ⇒ τ is
  # a CONFOUNDED LEVER, which is a STRONGER reason to keep it authored than a dead one: a student
  # dragging it would move the verdict without moving the mechanism. (⭐ And the slice's own claim
  # survives the whole span — at EVERY τ this design is quiet where strapdown rings.) `gimbal_stop_deg`
  # is a RESTATEMENT of slice 33's excursion and couples the two budgets (a second mechanism);
  # `cross_speed_mps` is slice 32's axis and moves the LEAD; `n_pn` and `rho` move the parasitic
  # boundary AND the guidance loop; `af_alpha_max` is slice 26's amplitude instrument and a confounded
  # lever; `sigma_seek` degrades the lesson beside it; `radome_slope`/`radome_ripple` are the GLASS (a
  # HARDWARE property — the arc's point since 27 is that what you can change is what you BELIEVE about
  # it); `elevation_deg` is the slice-19 DEAD-knob class.
  #
  # ⚠⚠ THE LABELS ARE LENGTH-BUDGETED AND THAT IS NOT COSMETIC — SLICE 32's SHOTS PAID FOR IT. Knob
  # labels are drawn FULL-WIDTH in the UI CanvasLayer, which paints OVER the Node2D `_draw` HUD whose
  # column starts at `vp.x − 430`; at ~6.2 px per character that is a budget of ~110 CHARACTERS.
  # Slice 32's first draft ran 172 and 157 and covered its own DISCRIMINATING TOOTH.
  - {target: m1, key: gimbal_fov_deg, min: 1.0, max: 8.0,
     label: "SEEKER: detector window (deg) — what the head's tracking error is spent from"}
  - {target: m1, key: radome_slope_est, min: -0.36, max: -0.03,
     label: "DESIGN: believed slope R̂ — it moves the ring AND the tracking error"}
