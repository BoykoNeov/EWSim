# slice32_fov — THE SEEKER'S FIELD OF VIEW: THE ENVELOPE IS SET BY WHAT THE SEEKER CAN SEE
# (HANDOFF §11 Tier-A, slice 32 gate 3). The TENTH slice of the bank-to-turn / 3-D arc (23 = the
# 6-DOF substrate + skid-to-turn, 24 = bank-to-turn + roll-lag, 25 = a seeker in the 6-DOF loop,
# 26 = the radome parasitic loop, 27 = the compensation autopilot, 28 = the slope CURVE, 29 = the
# SCHEDULED compensator, 30 = the ENVELOPE and the one-sided constraint, 31 = an imperfect gyro),
# and a deferral every one of them NAMED and each one sharpened.
#
# Slices 26–31 made the LOOK ANGLE the central quantity of the whole radome family, and then each
# of them bounded its knob domains by that angle reaching 30° — declared every time as a §1
# MODEL-VALIDITY caveat, a place where the small-angle linear bend stops being trustworthy. A REAL
# seeker makes the same angle a PHYSICAL STOP: it has a field of view, and past it there is no
# measurement at all. So the caveat and the hardware coincide, and the arc's FIRST SENSOR-SIDE CAP
# lands — every previous cap in this project is airframe or actuator (slices 10/12's authored
# magnitude clamp, 15's jerk and deflection caps, 19's flight-condition lift ceiling, 22's interior
# peak of the lift curve).
#
# > THE LESSON, IN ONE SENTENCE. The FOV a seeker needs is not a seeker number — it is the
# > ENGAGEMENT's own lead angle, so a field of view does not cost you accuracy, it costs you the
# > ENVELOPE: the set of targets you may engage at all.
#
# A crossing target must be LED, the lead is a closed-form property of the collision triangle
# (`V_m·sin λ = V_t·sin θ`, frames.jl `collision_lead_angle`, shipped live as `lead_angle_deg`), and
# the missile must hold that lead ALL THE WAY IN. If the lead exceeds the window, the seeker loses
# the target WHILE THE LEAD IS STILL BUILDING, the α-β tracker coasts on a rate that was right for a
# smaller lead, and the geometry runs away monotonically — a kilometre-scale miss out of a missile
# with 0.0 % of its approach saturated: every bit of the authority it needs and no idea where to
# point it.
#
# ⚠ SCOPE: A STRAPDOWN FOV, NOT A GIMBAL SERVO. There is no head state anywhere in this codebase —
# today's seeker is strapdown with an infinite window, and `look_angles` measures the LOS off the
# BODY boresight. This wire ships the TRACK-BREAK: |look| > fov ⇒ no measurement ⇒ the tracker
# coasts. A REAL gimbal (a head with its own state, servo bandwidth, rate limit and mechanical stop)
# is a different and bigger slice: it adds a dynamical state AND it rewrites 26–31's `look_az`,
# because the bend would key off the HEAD-vs-body angle rather than the LOS-vs-body angle. NAMED
# DEFERRAL, and the reason is written at the seam in `missile.jl`.
#
# ⚠⚠ THE SIGNATURE IS SLICE 23's AND SLICE 25's, AND THE MECHANISM IS NEITHER (the copy-paste
# false-claim trap, 3rd occurrence in this arc — the distinction is WRITTEN, never inherited):
#   slice 23  ≈2000 m, max|y| = 0.0  — the autopilot THREW the out-of-plane command AWAY
#   slice 25  ≈2000 m, max|y| = 0.0  — the command was NEVER FORMED (a scalar in-plane seeker
#                                      cannot represent it)
#   slice 32  kilometres, max|y| ≫ 0 — it WAS formed and flown, and then the SENSOR STOPPED
#                                      SUPPLYING IT MID-FLIGHT: the missile turns, holds the lead,
#                                      and loses the target with the lead still building.
# ⚠ The `fov = 0` degenerate reaches 23's and 25's max|y| = 0.0 signature by a FOURTH route (a
# seeker that never locks reports no LOS rate, so PN commands nothing out of plane) — which is
# exactly why the SHIPPED arm's max|y| ≫ 0 is the discriminating tooth and the miss is not.
#
# ⚠ INHERITED LANGUAGE AND ITS PROHIBITIONS. Slice 32 adds NO new instability, NO new loop gain and
# NO new plant. Slice 26's positive-feedback / limit-cycle language stays with 26–31; slice 20's
# "degenerative spiral" stays forbidden. What is new is a HARD SENSOR LIMIT and, through it, an
# ENGAGEMENT ENVELOPE.
#
# ⚠⚠ THE RADOME KEYS ARE ABSENT BY DESIGN (convention 9, and the advisor said it before any code):
# 26–31's wire RINGS by construction, and A RINGING ARM'S LOOK ANGLE SWINGS BECAUSE IT RINGS — so
# the look angle measured on it is the LOOP's and not the ENGAGEMENT's. Deleting them puts the
# missile on the slice-25 clean path, where the look angle is the collision triangle's lead and
# nothing else. The radome × FOV corollary IS measured (slice 26's parasitic loop can shake the
# seeker out of its own window) but it is a SECOND MECHANISM, so it lives in `test_missile.jl` —
# the slice-28 precedent for relocating a claim that is not client-drivable.
#
# ⚠ THE METRIC IS THE MISS, AND THAT INVERTS 28–31's. `rms r` must NOT be inherited: losing the
# measurement CUTS the parasitic feed, so on a ringing wire a tight FOV would LOWER rms r while
# OPENING the miss and the slice would be written backwards. Here the miss opens ~10⁴× and a big
# miss samples FAITHFULLY ([[ewsim-missile-verifier-sampling]] cuts the right way for once). ⚠ The
# miss MAGNITUDE is NOT monotone in `fov` inside the broken region (a ballistic-scatter number);
# the VERDICT is monotone and sharp to 0.02°, so the verifier ASSERTS the verdict and the
# out-of-window fraction and QUOTES the miss.
#
# ⚠ EVERY LOOK-ANGLE NUMBER IS RANGE-GATED AT r > 200 m. Ungated, the max reads 151–180° — the
# post-CPA LOS flip — and the out-of-window fraction on a QUIET arm reads a few hundredths of a
# percent rather than zero, because the LOS unit vector swings through a large angle in the last
# millisecond before impact. Gated, the quiet arms are EXACTLY 0.000 %.
#
# ⚠ ISOLATION: `aero_sat` is 0.00 % in the r ∈ [500, 3000] m band in EVERY arm, broken or not ⇒ a
# POINTING miss, NOT the arc's ceiling miss (slices 19–24). The whole-approach number is ~6.5 % and
# it is ~6.5 % IN THE REFERENCE ARM TOO — a launch transient, the front-loaded baseline 28/31
# measured in `rms r` arriving here in a different quantity. Assert the FLAG as a number; never
# hand-roll the compare (the sets nest — slice 19).
#
# NO FIDELITY BUTTON, DELIBERATELY — the EIGHTH slice in that family (16, 26, 27, 28, 29, 30, 31,
# 32) whose lesson is sliders with no button at all. `seeker_fov_view` is the handshake marker that
# makes the client DROP it (slice 16's Option-P′, and slice 26's own reasoning transfers verbatim:
# the inherited cycler here would be slice 25's `seeker_axes`, whose other position `:pitch_plane`
# leaves the WINDOW LIVE on a missile that ALSO misses by 2000 m for a wholly unrelated reason —
# two mechanisms compounding in one view). KNOB, not rung: `seeker_fov_deg = 180` is bit-identical
# to the key being absent ON THIS WIRE (gate 0 P4a, measured — and it is an empirical statement
# about the look angles this engagement REACHES, never "180° admits everything": the angle-space
# radius hypot(az, el) has supremum hypot(π, π/2) ≈ 201.246°, so a 180° window genuinely rejects the
# anti-boresight. Both facts are pinned in `test_frames.jl`.)
#
# NAMED APPROXIMATIONS (§1): a STRAPDOWN window, not a gimbal (above); a CIRCULAR window
# `hypot(look_az, look_el)` — precisely the quantity the radome comments correctly warn is the WRONG
# one for per-axis glass, and the RIGHT one here; a rectangular / per-axis FOV is a named deferral.
# The window is computed from the TRUTH LOS: whether the target is inside it is PHYSICS, not an
# estimate. No seeker RANGE / SNR acquisition limit — this slice models only the ANGLE. And
# everything 23–31 named: ONE isotropic σ and a TRUTH Vc (slice 11's scope); diagonal inertia,
# symmetric cruciform, lift drag-free (23/24); constant ρ — a FLIGHT CONDITION, so say "low dynamic
# pressure", never "high altitude".
#
# Class 4a: DRAW-INVARIANT (2 randn/tick — an out-of-window tick DRAWS `n_az`/`n_el` and DISCARDS
# them, slice 25's own lockstep: the foil discards, it does not skip) YET TRAJECTORY-CHANGING.
# EIGHTH consecutive RNG-live slice (25–32): the seed is load-bearing, conventions 3/11 apply, and
# the draw-count identity is ASSERTED in `test_missile.jl`, not assumed.
# UNITS (§1 trifecta): pos/vel SI; angles rad INSIDE the core; `seeker_fov_deg` in DEGREES at the
# YAML boundary → radians at the seam (the `elevation_deg` posture), and it is a TOTAL off-boresight
# HALF-angle; σ_seek in RADIANS; `cross_speed_mps` in m/s and SIGNED; I in kg·m²; ρ in kg/m³; launch
# ELEVATION in DEGREES → radians at the loader. dt = 1e-3 / emit_every = 16.
name: slice32_fov
seed: 32
dt_physics: 1.0e-3
emit_every: 16

fidelity:
  # FIVE keys, NONE toggled — the lesson is the SLIDERS (the slice-16/20/26/27/28/29/30/31 shape).
  # `airframe` HELD at :six_dof (the window is INERT without it — there is no attitude to measure a
  # look angle OFF; the gate is on the LIVE rung, never on `:att_q`, which is minted once and never
  # deleted: the slice-21/23/26/27/28/29 latent-bug class, whose SIXTH occurrence this would be),
  # `seeker_axes` HELD at :az_el (a two-angle seeker is what HAS a look angle at all — and the
  # loader REFUSES `seeker_fov_deg` without `two_angle: true` for exactly that reason), `seeker`
  # HELD at :filtered, `autopilot` :alpha and `guidance` :pn as in 23–31. `steering` is OMITTED (the
  # loader default IS :skid_to_turn — slice 24 measured BTT binding the aero ceiling 93.2 % of its
  # approach, which would destroy the aero_sat = 0 isolation this slice's whole claim rests on).
  airframe: six_dof
  autopilot: alpha
  guidance: pn
  seeker: filtered
  seeker_axes: az_el

entities:
  # The interceptor — slices 23–31's plant and launch condition, UNCHANGED. n_pn = 8 is slice 27's,
  # AUTHORED and NEVER A KNOB (26–31 all disqualified it: it moves the guidance loop the lesson is
  # not about).
  #
  # ⚠ elevation_deg = 12.0 IS LOAD-CONSUMED AND IS NOT A KNOB — twice over. It is the slice-19 DEAD
  # KNOB class (position/attitude are built once at load and `reset` re-reads the YAML), AND gate
  # 0's P5 found it is the thing that sets this wire's NEVER-ACQUIRES FLOOR: below a ~18.12° window
  # the seeker never gets a first measurement at all, and that cliff tracks the TICK-1 look angle to
  # 0.008° while moving with `elevation_deg` (21.34 / 18.86 / 18.12 / 19.30 / 22.11 at 0 / 6 / 12 /
  # 18 / 24°). It is minimized rather than zeroed at 12° because the target's launch BEARING is
  # ~18.4° in AZIMUTH and no pitch attitude removes it. ⭐ THE TERMINAL-LEAD HALF IS INVARIANT to the
  # same change (28.95 / 28.79 / 28.73 at vy = 400) — ONE binding constraint, not two, which is why
  # the FOV domain starts ABOVE the cliff and the slider therefore measures the SEEKER.
  #
  # THE WINDOW:
  #   seeker_fov_deg = 25.0 — ⚠ THE SHOWCASE OPENS ON THE DISEASE (the slice-25/26/27/28/29/30/31
  #     shape): the default engagement is ALREADY OUTSIDE the envelope when the client connects. A
  #     25° seeker flies vy = 260 and vy = 320; against the 400 m/s crossing authored below the lead
  #     reaches ~29° and the track BREAKS while it is still building.
  #   sigma_seek = 5e-5 — slices 26–31's AUTHORED CONSTANT, not a knob (a knob that DEGRADES the
  #     lesson beside it).
  - id: m1
    kind: missile
    pos: [0.0, 0.0, 3000.0]
    missile:
      mass_kg: 140.0
      speed: 700.0
      elevation_deg: 12.0
      cd_area_m2: 0.0
      rho: 1.0
      seeker: {sigma_seek: 5.0e-5, alpha: 0.30, beta: 0.05, two_angle: true,
               seeker_fov_deg: 25.0}
      guidance: {n_pn: 8.0, a_max: 3000.0, delta_max: 0.5, k_alpha: 1.0, k_q: 0.3}
      airframe:
        ref_len_m: 0.2
        inertia_kgm2: 20.0
        cma: -1.0
        cmd: 3.0
        cmq: -150.0
        cla: 20.0
        alpha_max: 0.3
        cy_beta: 20.0
        inertia_roll_kgm2: 2.0
        inertia_yaw_kgm2: 20.0
        c_roll: 50.0
  # ⭐ THE CROSSING TARGET, AND ITS SPEED IS THE OTHER HALF OF THE COMPARISON. Same start point as
  # 23–31 (cross-range +Y = 2000 m off the x–z plane), with slice 30's `cross_speed_mps` pin
  # INHERITED UNCHANGED and its default raised to 400 m/s — the top of slice 30's own envelope, and
  # the cell a 25° seeker cannot fly. AERODYNAMICALLY FREE (no target airframe — the lesson is about
  # the interceptor's sensor, not about the target).
  # ⚠ THE AUTHORED `vel` AND THE PIN AGREE AT THE DEFAULT, ON PURPOSE — that equality is slice 30's
  # knob-vs-rung discriminator, measured bit-identical to the key being absent. (It is also why the
  # pin-ordering bug is invisible to an equal-value test; the discriminating tooth is a DISAGREEING
  # pair and it lives in `test_radar.jl`.)
  - id: tgt1
    kind: target
    pos: [6000.0, 2000.0, 4200.0]
    vel: [0.0, 400.0, 0.0]
    target: {rcs_m2: 1.0, cross_speed_mps: 400.0}

knobs:
  # ⭐⭐ TWO KNOBS, AND CONVENTION 9 IS SATISFIED BY A MEASUREMENT, NOT BY COUNTING SLIDERS: they are
  # the TWO TERMS OF ONE COMPARISON, `fov` vs `lead(vy)`, and the verdict flips exactly where the
  # difference crosses zero — reached from BOTH directions and agreeing to 0.01–0.03° (gate 0 P4b).
  # The envelope flips in both: vy 260 flies a 20° window, vy 320 breaks it and flies 25°, vy 400
  # breaks that and flies 30°. ⚠ AND THE ASYMMETRY IS THE PAYLOAD: widening the seeker keeps the
  # engagement, slowing the crossing means DECLINING it. Cure A is free; cure B is not.
  #
  # KNOB 1 (`seeker_fov_deg`, the HARDWARE side). THE FLOOR IS STATED WITH ITS REASON (slice 26's
  # post-commit discipline — endpoints MEASURED, never inferred): below 18.120° the seeker never
  # acquires on this wire, but THAT CLIFF IS THE SCENARIO'S AUTHORED LAUNCH ATTITUDE, NOT A SEEKER
  # PROPERTY (gate 0 P5, and see `elevation_deg` above), so the domain starts above it and the
  # slider measures the SEEKER. The CEILING is INERT across the whole crossing-speed axis — every
  # cell hits from 30° up — which is the measured reason it stops at 40 rather than at 180.
  #
  # KNOB 2 (`cross_speed_mps`, the ENGAGEMENT side) — slice 30's axis, INHERITED UNCHANGED with its
  # domain. ⚠ Its FLOOR is a MEASURED DEAD POINT: at vy = 0 the collision course carries no lead
  # (look 0.32°), the seeker sits on boresight and no window in the domain can be reached. Its
  # CEILING is slice 30's MODEL-VALIDITY budget, and slice 32 is where that budget stops being a
  # caveat and becomes hardware: the max reachable lead over slice 30's whole envelope is ~29°,
  # exactly the 30° every one of 28/29/30/31 declared.
  #
  # ⚠ EVERY OTHER CANDIDATE IS DISQUALIFIED, AND THE VERIFIER ASSERTS THEIR ABSENCE: `n_pn` and
  # `rho` move the guidance loop the lesson is not about; `radome_*` is a SECOND MECHANISM (see the
  # corollary note above); `sigma_seek` degrades the lesson beside it; `elevation_deg` is the
  # slice-19 DEAD-knob class AND gate 0's P5 artifact; `af_alpha_max` is the arc's aero ceiling,
  # held at 0.0 % here on purpose.
  - {target: m1, key: seeker_fov_deg, min: 20.0, max: 40.0,
     label: "SEEKER: field of view (deg, total off-boresight) — widen past the ENGAGEMENT's lead and the track holds; below it the seeker loses the target while the lead is still building"}
  - {target: tgt1, key: cross_speed_mps, min: 0.0, max: 400.0,
     label: "ENGAGEMENT: target crossing speed (m/s) — it sets the LEAD the missile must hold, and the lead is what the window has to contain; at 0 there is no lead at all"}
