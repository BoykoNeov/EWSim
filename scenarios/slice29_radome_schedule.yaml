# slice29_radome_schedule — R̂(look): THE SCHEDULE THAT LOOKS THROUGH ITS OWN RADOME
# (HANDOFF §11 Tier-A, slice 29 gate 3). The SEVENTH slice of the bank-to-turn / 3-D arc (23 = the
# 6-DOF substrate + skid-to-turn, 24 = bank-to-turn + roll-lag, 25 = a seeker in the 6-DOF loop,
# 26 = the radome parasitic loop, 27 = the compensation autopilot, 28 = the slope CURVE), and the
# deferral slice 28 named as its own successor:
#
#     "LOOK-ANGLE-SCHEDULED R̂(look) — SLICE 29. The engineering answer to this slice, exactly as 27
#      was to 26."
#
# Slice 27 gave the missile a rate-gyro feed-forward with a SCALAR belief. Slice 28 showed the glass
# has no single slope, so the belief must be a CURVE. Making it one is three lines — and it raises a
# question a scalar never had to answer: EVALUATED WHERE?
#
# > THE LESSON, IN ONE SENTENCE. A scheduled compensator must be indexed on the look angle it HAS,
# > which is the one the radome already bent — so what closes the loop is the residual measured at
# > the COMPENSATOR'S OWN INDEX, the schedule's own slope R̂' = dR̂/dlook is the sensitivity that
# > decides what that indexing error costs, and slice 27's rule "compensate with a signal that is not
# > itself corrupted by what you are compensating" comes back in the RATE domain — the place slice 27
# > concluded was safe — because THE IMMUNITY WAS NEVER THE DOMAIN, IT WAS THE CONSTANCY (R̂' ≡ 0).
#
# ⭐⭐ THE WHOLE SLICE IN ONE PAIR OF ARMS, BOTH REACHED WITH ONE SLIDER. The shipped k̂ = 10 is a
# BETTER model of the glass than k̂ = 17: measured against the true curve at a common reference look
# angle it is wrong by −0.041, against −0.152 for k̂ = 17, and the onset measured ON THIS WIRE is
# −0.056. So slice 26/27/28's law says 10 should be quiet and 17 should ring. THE OPPOSITE HAPPENS
# (rms r 0.637 vs 0.017), because at their OWN indices — 2.4–2.7° low, that gap being the bend
# itself — they are wrong by −0.067 and −0.001. ⭐ The truth-indexed residual gets two of three arms
# WRONG; the index-shifted one, which is what `radome_residual_az` ships, gets every arm right.
#
# ⚠⚠ THE NAIVE SLICE WAS REFUTED AT GATE 0 AND THE REFUTATION IS WHY THIS WIRE LOOKS LIKE 28's.
# "A scalar cannot cancel a curve" is FALSE here: on a settled PN collision course
# V_M·sin(L) = V_T·sin(aspect) with the LOS direction fixed, so the lead angle is CONSTANT BY
# CONSTRUCTION — measured on a stable arm, slice 28's wire holds look_az to a 0.2° band (14.9→15.1),
# which makes a schedule there observationally a scalar. Opening the band with a maneuvering target
# does not license it either: the BEST POST-HOC scalar matches the exact schedule (1.06 / 0.97 /
# 1.07 / 1.40×), because the parasitic loop needs DWELL at a supercritical residual and a band the
# engagement SWEEPS THROUGH is visited briefly everywhere. ⇒ THE FROZEN LOOK ANGLE IS THE ENABLING
# CONDITION, NOT AN OBSTACLE, and slice 29 keeps slice 28's geometry untouched — the first slice of
# the arc with a measured reason NOT to move the wire. ⚠ Say "the geometry is inherited, the glass is
# deepened": A goes −0.05 → −0.15 (AUTHORED), which is what gives the k̂ tolerance band an interior.
#
# ⭐⭐ AND THE OTHER REFUTATION IS ITSELF A RESULT, carried here as framing and deferred as its own
# slice: THE RADOME STABILITY CONSTRAINT IS ONE-SIDED. Only a NEGATIVE residual rings; a positive one
# merely DE-TUNES. So a scalar set at or below the most negative slope the glass reaches anywhere in
# the envelope is UNCONDITIONALLY STABLE across all of it (measured across crossing speeds 80–260).
# ⇒ GAIN SCHEDULING BUYS PERFORMANCE, NOT STABILITY, and slice 27's "know your slope to within
# 0.38/(N·ρ)" is a TWO-SIDED reading of a ONE-SIDED constraint. It is not free either — the purchase
# de-tunes (ω_ratio to 0.25, envelope miss to 47 m as the slope span grows) — but that claim is
# MULTI-ENGAGEMENT and target velocity is not a comp key, so it is NOT shipped here (the slice-27/28
# not-client-drivable precedent) and lives in `docs/plans/slice29.md` as the strongest successor.
#
# ⚠ THE METRIC, THE WINDOW AND THE CHANNEL ARE SLICE 28's, DELIBERATELY: rms r (YAW) in the RANGE
# BAND r ∈ [500, 3000] m — the lead is in azimuth so the ring is in yaw; a crossing wire's
# whole-approach rms r carries a legitimate front-loaded baseline; arms with different ToF would
# otherwise compare different parts of the engagement. ⚠ QUOTE THE WINDOW WITH EVERY NUMBER.
# ⚠ rms, NEVER the peak. ⚠ THE MISS IS NOT THE METRIC — every arm here HITS (0.02–2.2 m).
# ⚠⚠ AND NO RESIDUAL MAY BE QUOTED AS A MEDIAN ON A RINGING ARM: the shipped arm's look band is
# 7.4–18.7° against 14.5–15.0° for the quiet arms, so a median taken there describes the ring, not
# its cause (slice 28 §1's own rule, which this slice's draft violated until an advisor pass caught
# it). Residual claims are ONE-SIDED on the most negative value, over a non-ringing reference band.
#
# ⚠ NO NEW INSTABILITY AND NO NEW CAP. The loop is slice 26's. Slice 20's "degenerative spiral"
# language stays forbidden here; slice 26's stays forbidden elsewhere. ⚠ AND `radome_sched_slope` is
# a SENSITIVITY, never "the loop gain" — the first-order form R̂'·(index error) is good away from
# k̂ ≈ k and FAILS at k̂ = k, where the operating look angle sits at the curve's own extremum and the
# second-order term carries it (−0.001 predicted against −0.022 actual). The RESIDUAL decides.
#
# NO FIDELITY BUTTON, DELIBERATELY — slice 26's `radome_view` marker is INHERITED UNCHANGED and the
# client keeps the button DROPPED. `Â = 0` is an in-domain slider value AND bit-identical to the
# schedule not existing (the compensator collapses to slice 27's scalar), so it is a KNOB by
# atmosphere.jl's discriminator. FIFTH slice in this family (16, 26, 27, 28, 29) whose lesson is
# sliders with no button at all.
#
# NAMED APPROXIMATIONS (§1): a PERFECT rate gyro (slice 27's, unchanged — an imperfect one is a named
# deferral, and a scale-factor error lands straight back on the belief); the two-term feed-forward
# leaves the PITCH→AZIMUTH cross-term uncancelled (slice 27's gate-1 finding); a SYMMETRIC radome and
# ONE scalar curve PER AXIS (slice 28's); no seeker FOV / gimbal limit — sharper again here, since
# this slice makes the compensator's INDEX a first-class quantity and a gimbal limit truncates
# exactly that index; ONE isotropic σ and a TRUTH Vc (slice 11's scope); diagonal inertia, symmetric
# cruciform, lift drag-free (slices 23/24); constant ρ — a FLIGHT CONDITION, so say "low dynamic
# pressure", never "high altitude". The small-angle bend model is held INSIDE its validity budget by
# measurement: 0.0% of in-band frames past a 30° look angle across every arm, peak bend ≤ ~4°.
#
# Class 4a: DRAW-INVARIANT (2 randn/tick, scheduled or not — the schedule is arithmetic on state that
# already exists) YET TRAJECTORY-CHANGING. FIFTH consecutive RNG-live slice (25, 26, 27, 28, 29): the
# seed is load-bearing and conventions 3/11 apply. Draw-count identity is ASSERTED, not assumed.
# UNITS (§1 trifecta): pos/vel SI; angles rad; σ_seek in RADIANS; `radome_slope`, `radome_ripple`,
# `radome_slope_est` and `radome_ripple_est` DIMENSIONLESS and SIGNED (dε/d(look angle));
# `radome_ripple_k` and `radome_ripple_k_est` per RADIAN of look angle; I in kg·m²; ρ in kg/m³;
# launch ELEVATION in DEGREES → radians at the loader. dt = 1e-3 / emit_every = 16.
name: slice29_radome_schedule
seed: 29
dt_physics: 1.0e-3
emit_every: 16

fidelity:
  # FIVE keys, NONE toggled — the lesson is the SLIDERS (the slice-16/20/26/27/28 shape). `airframe`
  # HELD at :six_dof (the radome, its compensator and the schedule are all INERT without it — there
  # is no attitude to look through; the gate is on the LIVE rung, never on `:att_q`, which is minted
  # once and never deleted: the slice-21/23/26/27/28 latent-bug class, whose SIXTH occurrence this
  # would be), `seeker_axes` HELD at :az_el (a two-angle seeker is what HAS a look angle in azimuth
  # at all), `seeker` HELD at :filtered, `autopilot` :alpha and `guidance` :pn as in 23–28.
  # `steering` is OMITTED (the loader default IS :skid_to_turn — slice 24 measured BTT binding the
  # aero ceiling 93.2% of its approach, which would confound the metric).
  airframe: six_dof
  autopilot: alpha
  guidance: pn
  seeker: filtered
  seeker_axes: az_el

entities:
  # The interceptor — slices 23–28's plant and launch condition, UNCHANGED. n_pn = 8 is slice 27's,
  # AUTHORED and NEVER A KNOB (26/27/28 all disqualified it: it moves the loop gain the lesson is
  # ABOUT, so a student could cross the boundary with the belief untouched — the confounded-lever
  # rule). The radome block is where slices 28 and 29 live side by side:
  #
  # THE GLASS (all AUTHORED — a knob on the plant would let a student move the thing the belief is
  # being compared against):
  #   radome_slope    = −0.03 — the BORESIGHT slope R₀, a GOOD radome on slice 26's scale.
  #   radome_ripple   = −0.15 — the amplitude A. ⚠ DEEPER than slice 28's −0.05, and that is the one
  #     substantive change to the wire: it is what makes the k̂ tolerance band wide enough to have an
  #     interior. (Slice 28's floor of −0.10 bounded ITS knob's measured plateau; here A is the
  #     plant.) Validity re-measured at this depth: >30° look = 0.0%, peak bend ≤ ~4°.
  #   radome_ripple_k = 12.0 — a 30° ripple period, so the curve's extremum sits on the ~15° lead
  #     this crossing geometry holds. ⚠ STILL NOT A KNOB (slice 28's non-monotonicity finding stands
  #     for the GLASS's k); its BELIEF twin below is a different measurement and IS one.
  #
  # THE BELIEF (slice 29):
  #   radome_slope_est   = −0.03 — R̂₀, correct at boresight BY CONSTRUCTION (R(0) = R₀ for every A —
  #     slice 28's mechanism, inherited). AUTHORED: this slice is about the CURVE, not the level.
  #   radome_ripple_est  = −0.15 — Â, the level EXACTLY RIGHT. A KNOB.
  #   radome_ripple_k_est = 10.0 — k̂, the SHAPE 17% low. A KNOB, and the headline one.
  #     ⚠ THE SHOWCASE OPENS ON THE DISEASE (the slice-25/26/27/28 shape): the body is already
  #     ringing when the client connects, with a schedule that is a BETTER model of the glass than
  #     the one at k̂ = 17 which stays quiet.
  #   sigma_seek = 5e-5 — slices 26/27/28's AUTHORED CONSTANT, not a knob (a knob that DEGRADES the
  #     lesson beside it).
  - id: m1
    kind: missile
    pos: [0.0, 0.0, 3000.0]
    missile:
      mass_kg: 140.0
      speed: 700.0
      elevation_deg: 12.0
      cd_area_m2: 0.0
      rho: 1.0
      seeker: {sigma_seek: 5.0e-5, alpha: 0.30, beta: 0.05, two_angle: true,
               radome_slope: -0.03, radome_ripple: -0.15, radome_ripple_k: 12.0,
               radome_slope_est: -0.03, radome_ripple_est: -0.15,
               radome_ripple_k_est: 10.0}
      guidance: {n_pn: 8.0, a_max: 3000.0, delta_max: 0.5, k_alpha: 1.0, k_q: 0.3}
      airframe:
        ref_len_m: 0.2
        inertia_kgm2: 20.0
        cma: -1.0
        cmd: 3.0
        cmq: -150.0
        cla: 20.0
        alpha_max: 0.3
        cy_beta: 20.0
        inertia_roll_kgm2: 2.0
        inertia_yaw_kgm2: 20.0
        c_roll: 50.0
  # THE CROSSING TARGET — slice 28's, VERBATIM, and gate 0 measured why it must not change. A static
  # target's collision course carries zero lead and settles the seeker onto boresight; this one holds
  # a SUSTAINED ~15° lead for the whole flight, which parks the operating point on steep glass AND
  # holds it still long enough for the loop to build a limit cycle. Aerodynamically free (no target
  # airframe — the lesson is about the interceptor's sensor).
  - id: tgt1
    kind: target
    pos: [6000.0, 2000.0, 4200.0]
    vel: [0.0, 200.0, 0.0]
    target: {rcs_m2: 1.0}

knobs:
  # ⭐ TWO KNOBS, and convention 9 is satisfied by a MEASUREMENT, not by counting sliders: they are
  # the two halves of ONE object — the compensator's BELIEF about the curve, its LEVEL (Â) and its
  # SHAPE (k̂) — and the core ships the quantity that decides (`radome_residual_az`, at the
  # compensator's own index) plus the one that explains it (`radome_sched_slope`) as NUMBERS, so the
  # pairing is a reading rather than an argument.
  #
  # KNOB 1 (k̂, the HEADLINE and the new one). ⭐ A LEGITIMATE KNOB, and the CONTRAST WITH SLICE 28's
  # `k` IS THE POINT: 28 DISQUALIFIED the glass's k for genuine oscillation (quiet/rings/rings/
  # marginal/QUIET/rings). The BELIEF's k̂ is a different measurement and comes out differently — a
  # single CONNECTED quiet window, k̂ ∈ [≈10.7, ≈19.5] about a true k = 12, so a student can walk it.
  # MEASURED at the shipped Â: 0.988 / 0.894 / 0.829 / 0.637 / 0.113 / 0.0087 / 0.0093 / 0.0122 /
  # 0.0157 / 0.0173 / 0.0208 / 0.447 / 0.787 at k̂ = 6 / 8 / 9 / 10 / 10.5 / 11 / 12 / 14 / 16 / 17 /
  # 19 / 20 / 22. ⭐ ITS ASYMMETRY IS THE LESSON: over-estimate the ripple frequency by 60% and stay
  # quiet, under-estimate it by 15% and ring — and NOT because of the residual against the glass
  # (symmetric: −0.041 at k̂ = 10 against −0.152 at k̂ = 17, i.e. the RINGING arm is the better model)
  # but because of where each lands once indexed 2.6° low. BOTH ENDPOINTS MEASURED AS UNAMBIGUOUS
  # RINGS (0.988 at 6, 0.787 at 22) — slice 26's post-commit rule: measure the declared endpoints
  # rather than infer them, which moved this ceiling off 20 (only 0.447, a marginal edge).
  #
  # KNOB 2 (Â, the LEVEL half). MONOTONE; ring onset between −0.13 (0.357, marginal) and −0.14
  # (0.0088); over-estimation safe and gentle (0.0093 / 0.0114 / 0.0161 / 0.0249 / 0.0349 at −0.15 /
  # −0.17 / −0.20 / −0.25 / −0.30) — the ONE-SIDEDNESS again, now inside the schedule's own
  # amplitude. The CEILING (0.00) is physical AND is the knob-vs-rung discriminator: the schedule
  # collapses to slice 27's scalar, `radome_sched_slope` goes exactly 0, and it rings hard (1.07).
  # The FLOOR (−0.30) is where over-estimation is still measured and gentle — UI framing, and it
  # says so rather than implying a physical wall.
  #
  # ⚠ EVERY OTHER CANDIDATE IS DISQUALIFIED, AND THE VERIFIER ASSERTS THEIR ABSENCE: `n_pn` and
  # `rho` move the LOOP GAIN the lesson is about; `radome_slope`/`radome_ripple`/`radome_ripple_k`
  # are the GLASS, i.e. the thing the belief is compared against; `radome_slope_est` is slice 28's
  # knob and would let a student cure the wire without ever touching the schedule; `af_alpha_max`
  # sets the cycle's AMPLITUDE; `sigma_seek` compresses the contrast; `speed` is the slice-19 DEAD
  # knob; the target's crossing speed is the deferred envelope slice's variable, not this one's.
  - {target: m1, key: radome_ripple_k_est, min: 6.0, max: 22.0,
     label: "SCHEDULE: believed ripple frequency k̂ (true k = 12 — UNDER-estimate by 15% and it RINGS, OVER-estimate by 60% and it does not)"}
  - {target: m1, key: radome_ripple_est, min: -0.3, max: 0.0,
     label: "SCHEDULE: believed ripple amplitude Â (true A = -0.15; at 0 the schedule collapses to slice 27's SCALAR and rings hard)"}
